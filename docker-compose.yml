# Webx 一键启动配置（酒吧点单系统）
#
# 使用方法：
#   docker compose up -d --build      # 构建并后台启动全部服务
#   docker compose logs -f gateway    # 查看网关日志
#   docker compose down               # 停止
#   docker compose down -v            # 停止并清空数据库/缓存数据
#
# 启动后入口：
#   http://localhost:8080/docs        # Swagger UI（聚合 people/catalog/orders）
#   http://localhost:8080/api/v1/...  # REST API
#
# 可通过环境变量覆盖默认值（也可写入同目录 .env 文件）：
#   JWT_SECRET        people 签发 / gateway 校验共享的 HS256 密钥（生产务必修改）
#   POSTGRES_PASSWORD postgres 密码（默认 webx）
#   LOG_LEVEL         日志级别（默认 info）
#   CORS_ORIGINS      允许的跨域来源（默认 *）

name: webx

# 所有 Go 服务共用的数据库连接串。各服务用独立的迁移跟踪表，互不干扰。
x-db-dsn: &db-dsn
  POSTGRES_DSN: "host=postgres port=5432 user=webx password=${POSTGRES_PASSWORD:-webx} dbname=webx sslmode=disable"

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "3"

services:
  # ==================== 基础设施 ====================
  postgres:
    image: postgres:16-alpine
    container_name: webx-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: webx
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-webx}
      POSTGRES_DB: webx
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U webx -d webx" ]
      interval: 5s
      timeout: 5s
      retries: 10
    logging: *default-logging

  redis:
    image: redis:7-alpine
    container_name: webx-redis
    restart: unless-stopped
    command: [ "redis-server", "--appendonly", "yes" ]
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 5s
      retries: 10
    logging: *default-logging

  # ==================== 微服务 ====================
  # People —— EVM 钱包登录 + RBAC（签发 JWT）
  people:
    build:
      context: .
      args:
        SERVICE: people
    image: webx-people:latest
    container_name: webx-people
    restart: unless-stopped
    environment:
      <<: *db-dsn
      PEOPLE_GRPC_ADDR: ":50051"
      PEOPLE_JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me}
      POSTGRES_MIGRATE: up
      POSTGRES_MIGRATE_DIR: /app/resources/people
      POSTGRES_MIGRATE_TABLE: people_migrations
      REDIS_ADDRS: "redis:6379"
      LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    logging: *default-logging

  # Catalog —— 菜单（菜品 + 价格）
  catalog:
    build:
      context: .
      args:
        SERVICE: catalog
    image: webx-catalog:latest
    container_name: webx-catalog
    restart: unless-stopped
    environment:
      <<: *db-dsn
      CATALOG_GRPC_ADDR: ":50052"
      POSTGRES_MIGRATE: up
      POSTGRES_MIGRATE_DIR: /app/resources/catalog
      POSTGRES_MIGRATE_TABLE: catalog_migrations
      LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      postgres:
        condition: service_healthy
    logging: *default-logging

  # Orders —— 点单（下单时向 catalog 查价并计算总额）
  orders:
    build:
      context: .
      args:
        SERVICE: orders
    image: webx-orders:latest
    container_name: webx-orders
    restart: unless-stopped
    environment:
      <<: *db-dsn
      ORDERS_GRPC_ADDR: ":50053"
      ORDERS_CATALOG_ADDR: "catalog:50052"
      POSTGRES_MIGRATE: up
      POSTGRES_MIGRATE_DIR: /app/resources/orders
      POSTGRES_MIGRATE_TABLE: orders_migrations
      LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      postgres:
        condition: service_healthy
      catalog:
        condition: service_started
    logging: *default-logging

  # Gateway —— 对外 HTTP/JSON 入口，集中鉴权 + Swagger 文档
  gateway:
    build:
      context: .
      args:
        SERVICE: gateway
    image: webx-gateway:latest
    container_name: webx-gateway
    restart: unless-stopped
    environment:
      GATEWAY_HTTP_ADDR: ":8080"
      GATEWAY_JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me}
      GATEWAY_PEOPLE_ADDR: "people:50051"
      GATEWAY_CATALOG_ADDR: "catalog:50052"
      GATEWAY_ORDERS_ADDR: "orders:50053"
      GATEWAY_CORS_ORIGINS: ${CORS_ORIGINS:-*}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports:
      - "8080:8080"
    depends_on:
      - people
      - catalog
      - orders
    logging: *default-logging

volumes:
  postgres_data:
  redis_data:
