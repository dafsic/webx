syntax = "proto3";

package people.v1;

option go_package = "github.com/dafsic/webx/proto_go/people/v1;peoplev1";

// User is the public projection of an account.
message User {
  int64 id = 1;
  string username = 2;
  string nickname = 3;
  // Unix seconds.
  int64 created_at = 4;
  // Unix seconds.
  int64 updated_at = 5;
}

message LoginRequest {
  string username = 1;
  string password = 2;
}

message LoginResponse {
  string token = 1;
  // Unix seconds.
  int64 expires_at = 2;
  User user = 3;
}
